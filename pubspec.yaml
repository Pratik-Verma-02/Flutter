name: agent_prompt
description: AI-Powered Prompt Generation Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.5.4
  firebase_crashlytics: ^4.3.4
  google_sign_in: ^6.2.2
  # State Management
  flutter_riverpod: ^2.6.1
  # Networking
  dio: ^5.7.0
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_colorpicker: ^1.1.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  # Utilities
  go_router: ^14.8.1
  intl: ^0.19.0
  uuid: ^4.5.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.1.3
  dynamic_color: ^1.7.0
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
