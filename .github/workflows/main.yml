name: Flutter Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # इसे v3 से v4 कर दिया गया है

      - name: Setup Java
        uses: actions/setup-java@v4 # इसे भी v4 कर दिया गया है
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4 # मेन एरर यहीं से था, इसे v4 कर दिया है
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
